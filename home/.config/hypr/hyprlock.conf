# Mac-style lock screen; authentication remains with the system PAM service.
general {
 hide_cursor = true
}
background {
 monitor =
 path = @HOME@/.local/share/wallpapers/WhiteSur.png
 blur_passes = 1
 blur_size = 3
 noise = 0
 contrast = 0.94
 brightness = 0.70
}
label {
 monitor =
 text = cmd[update:60000] date +"%A, %-d %B"
 color = rgba(f5f7fcff)
 font_size = 17
 font_family = Inter Medium
 position = 0, -54
 halign = center
 valign = top
 shadow_passes = 1
 shadow_size = 3
 shadow_color = rgba(00000045)
}
label {
 monitor =
 text = $TIME
 color = rgba(ffffffff)
 font_size = 82
 font_family = Inter SemiBold
 position = 0, -80
 halign = center
 valign = top
 shadow_passes = 1
 shadow_size = 4
 shadow_color = rgba(00000045)
}
shape {
 monitor =
 size = 76, 76
 rounding = -1
 color = rgba(e9eef5f5)
 border_size = 1
 border_color = rgba(ffffff88)
 position = 0, -10
 halign = center
 valign = center
 zindex = 1
}
label {
 monitor =
 text = U
 color = rgba(34485fff)
 font_size = 29
 font_family = Inter Medium
 position = 0, -10
 halign = center
 valign = center
 zindex = 2
}
label {
 monitor =
 text = $USER
 color = rgba(ffffffff)
 font_size = 20
 font_family = Inter SemiBold
 position = 0, -77
 halign = center
 valign = center
}
input-field {
 monitor =
 size = 280, 42
 outline_thickness = 1
 outer_color = rgba(dce9ff99)
 inner_color = rgba(263549db)
 font_color = rgba(ffffffff)
 font_family = Inter
 rounding = 12
 dots_size = 0.22
 dots_spacing = 0.25
 fade_on_empty = false
 placeholder_text = <span foreground="##e5eaf2">Enter password</span>
 check_color = rgba(91bfffff)
 check_text = Unlocking…
 fail_color = rgba(ff8e88ff)
 fail_text = Password incorrect. Try again.
 capslock_color = rgba(ffd580ff)
 position = 0, -130
 halign = center
 valign = center
}
label {
 monitor =
 text = Press Return to unlock
 color = rgba(e5eaf2ff)
 font_size = 10
 font_family = Inter
 position = 0, -178
 halign = center
 valign = center
}
label {
 monitor =
 text = Your session is locked
 color = rgba(e5eaf2ff)
 font_size = 10
 font_family = Inter
 position = 0, 34
 halign = center
 valign = bottom
}
