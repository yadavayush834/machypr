name: Validate MacHypr
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils python3-gi python3-pil gir1.2-glib-2.0
      - name: Validate and test isolated installation/restore
        run: PATH=/usr/bin:$PATH bash scripts/check.sh
