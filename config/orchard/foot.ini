# foot · orchard — macOS Terminal "Basic" look: system mono, roomy padding,
# light and dark palettes that follow the appearance (USR1/USR2).
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
line-height=15.5
pad=12x10
term=xterm-256color
selection-target=both
initial-color-theme=dark

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=20000

[csd]
preferred=none

[colors-dark]
alpha=0.94
background=1e1e1e
foreground=e6e6e6
selection-background=3f638b
selection-foreground=ffffff
urls=6cb6ff
cursor=1e1e1e e6e6e6
regular0=1e1e1e
regular1=ff6b68
regular2=67d76f
regular3=e5c07b
regular4=6cb6ff
regular5=d38aea
regular6=56d4dd
regular7=d0d0d0
bright0=6e6e6e
bright1=ff8f8c
bright2=8ee894
bright3=f2d99c
bright4=9bcdff
bright5=e3aef2
bright6=8ae7ed
bright7=ffffff

[colors-light]
alpha=0.97
background=ffffff
foreground=1d1d1f
selection-background=b4d7ff
selection-foreground=1d1d1f
urls=0058d0
cursor=ffffff 1d1d1f
regular0=1d1d1f
regular1=c41a16
regular2=007400
regular3=826b28
regular4=0b4fd1
regular5=a52aa8
regular6=0e7c86
regular7=8e8e93
bright0=6e6e73
bright1=e0322b
bright2=1e9e3e
bright3=a3871e
bright4=2f6fe8
bright5=c043c4
bright6=1898a3
bright7=c7c7cc

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
spawn-terminal=Control+Shift+n
