<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- orchard: Mac-like text everywhere.
     • grayscale antialiasing, light hinting (macOS never uses subpixel colour fringes)
     • web pages asking for -apple-system / SF / Helvetica get SF Pro if installed, else Inter
     • SF Mono / Menlo / Monaco map to SF Mono or JetBrains Mono -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <alias binding="same"><family>-apple-system</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Display</family><accept><family>Inter Display</family></accept></alias>
  <alias binding="same"><family>SF Pro</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Lucida Grande</family><prefer><family>SF Pro Text</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>SF Mono</family><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>SF Mono</family><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>SF Pro Text</family><family>Inter</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>SF Mono</family><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
