# orchard lock screen — macOS 26: blurred wallpaper, large date and time
# at the top, avatar + name + glass password field at the bottom.
general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}
auth { fingerprint:enabled = false }
animations {
    enabled = true
    bezier = mac, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, mac
    animation = fadeOut, 1, 3, mac
    animation = inputFieldDots, 1, 2, mac
}
background {
    monitor =
    path = ~/.local/state/orchard/lock-wallpaper.jpg
    color = rgba(20, 30, 60, 1)
    blur_passes = 3
    blur_size = 10
    brightness = 0.82
    vibrancy = 0.2
}
# date
label {
    monitor =
    text = cmd[update:60000] date '+%A %-d %B'
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Inter Display Medium
    position = 0, -90
    halign = center
    valign = top
}
# time — big, light, SF-style
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M'
    color = rgba(255, 255, 255, 0.92)
    font_size = 104
    font_family = Inter Display SemiBold
    position = 0, -118
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.18)
}
# avatar
image {
    monitor =
    path = ~/.local/state/orchard/avatar.png
    size = 64
    rounding = -1
    border_size = 0
    position = 0, 150
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 14
    font_family = Inter SemiBold
    position = 0, 118
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 220, 34
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.22)
    outer_color = rgba(255, 255, 255, 0)
    check_color = rgba(255, 255, 255, 0.30)
    fail_color = rgba(255, 69, 58, 0.45)
    font_color = rgba(255, 255, 255, 1)
    font_family = Inter
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    fail_text = <span foreground="##ffffffdd">Incorrect password</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    position = 0, 70
    halign = center
    valign = bottom
}
label {
    monitor =
    text = Enter Password
    color = rgba(255, 255, 255, 0.55)
    font_size = 10
    font_family = Inter
    position = 0, 46
    halign = center
    valign = bottom
}
